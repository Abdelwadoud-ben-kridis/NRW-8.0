# The dashboard, replaying a recorded demo run, on GitHub Pages -- no backend.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Re-record pages/replay.json with tools/record_replay.py (isolated server).
name: Dashboard replay (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "dashboard/**"
      - "pages/**"
      - "tools/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
