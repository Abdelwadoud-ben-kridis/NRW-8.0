# The dashboard, replaying a recorded demo run, on GitHub Pages -- no backend.
# Builds the static site and force-pushes it to the gh-pages branch, which
# GitHub Pages serves (Settings -> Pages -> Deploy from a branch: gh-pages / root).
# Re-record pages/replay.json with tools/record_replay.py (isolated server).
name: Dashboard replay (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "dashboard/**"
      - "pages/**"
      - "tools/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_pages.py _site
      - name: Push _site to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dashboard replay from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
