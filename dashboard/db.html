<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Core Warehouse — Database Explorer</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/db.css">
</head>
<body>
<div id="dbapp">

  <div id="dbtop">
    <div>
      <h1>Database Explorer</h1>
      <div class="sub">scw.db · read-only — every query here is a SELECT</div>
    </div>
    <div class="spacer"></div>
    <label class="livewrap"><input type="checkbox" id="live" checked> live</label>
    <button class="ghost" id="btn-refresh">Refresh</button>
    <a class="ghost linkbtn" href="/">← Live dashboard</a>
  </div>

  <div id="dbbody">

    <section class="kpis" id="kpis"></section>

    <div class="cols2">
      <section class="card">
        <h2>Schema</h2>
        <div id="erd"></div>
      </section>
      <section class="card">
        <h2>Relationships</h2>
        <div id="rels"></div>
      </section>
    </div>

    <div class="cols2">
      <section class="card">
        <h2>Boxes by state</h2>
        <div id="chartState" class="chart"></div>
      </section>
      <section class="card">
        <h2>Cores in stock by reference</h2>
        <div id="chartRef" class="chart"></div>
      </section>
    </div>

    <section class="card">
      <h2>Rack occupancy — <span id="gridSub" class="muted"></span></h2>
      <div id="gridLegend" class="legend"></div>
      <div id="rackgrid"></div>
    </section>

    <section class="card">
      <div class="tblhead">
        <h2 style="margin:0">Table browser</h2>
        <select id="tbl"></select>
        <input type="text" id="q" placeholder="filter text columns…">
        <span class="spacer"></span>
        <span class="muted" id="tblcount"></span>
        <button class="ghost" id="prev">◀</button>
        <button class="ghost" id="next">▶</button>
      </div>
      <div id="tblwrap"><table id="datatable"><thead></thead><tbody></tbody></table></div>
    </section>

  </div>

  <div id="tooltip" hidden></div>
</div>
<script src="/static/db.js"></script>
</body>
</html>
